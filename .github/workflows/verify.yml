# Weekly re-verification of every claim the site publishes.
#
# The site's promise is that "verified" means machine-checked, and that promise has a
# clock on it: sources move, pages get rewritten, links rot. This is the insurance —
# without it, the first reviewIntervalDays wave (December 2026) quietly turns the
# label into a lie.
#
# Needs no secrets: everything it does is fetch public pages and compare.
name: verify-evidence

on:
  schedule:
    # Mondays 06:17 UTC — off the whole-hour spike when every cron on GitHub fires.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: verify-evidence
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Schema, evidence rules and depth floors
        run: npm run validate

      - name: Every cited source still resolves
        run: npm run verify:links

      - name: Every quote is still on its page
        run: npm run verify:quotes

      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "verification-failure";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (open.length > 0) {
              // One open issue is a signal; a new one per failed run is noise.
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Still failing: ${runUrl}`,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Evidence verification failed",
              labels: [label],
              body: [
                "The weekly verification run found a problem: a cited source is unreachable,",
                "or a quoted sentence is no longer on its page.",
                "",
                `Run: ${runUrl}`,
                "",
                "Triage: open the run log. `verify:links` failures are dead URLs;",
                "`verify:quotes` failures mean the source changed — re-read it and either",
                "refresh the quote or revise the entry's claim. Hosts that merely refused",
                "the runner (403/429/503) are reported as *blocked* and do not fail the run.",
              ].join("\n"),
            });
