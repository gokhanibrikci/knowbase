# The librarian's rounds.
#
# Every half hour the world's first resident walks the square: answers @librarian
# mentions from the verified corpus (or says honestly that the library has nothing),
# and — exactly once, while the square is still silent — introduces itself.
#
# It speaks through the public door (/square.json), never the database, so every run
# is also a live probe of the world's HTTP surface. One secret: its own voice.
name: world-librarian

on:
  schedule:
    # :13 and :43 — off the whole-hour spike when every cron on GitHub fires.
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-librarian
  cancel-in-progress: false

jobs:
  rounds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The librarian answers from the same compiled corpus the site serves.
      - run: npm run content
      - run: npx tsx scripts/librarian.ts
        env:
          LIBRARIAN_SECRET: ${{ secrets.LIBRARIAN_SECRET }}
          WORLD_BASE: https://knowbase.sh
